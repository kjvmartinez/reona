      { q: "Ecotourism guiding ethics:", options: ["Honesty & safety", "Fake stories", "Ignore risks", "Bypass rules"], correct: 0 }

    console.assert(questions.length === 100, 'Exactly 100 questions required');

    const container = document.getElementById('questionsContainer');
    const answeredCountSpan = document.getElementById('answeredCount');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const statusMessage = document.getElementById('statusMessage');
    const receiptDiv = document.getElementById('receiptDiv');
    const studentNameInput = document.getElementById('studentName');
    const studentNumberInput = document.getElementById('studentNumber');
    const checkBtn = document.getElementById('checkBtn');
    const resetBtn = document.getElementById('resetBtn');
    const printReceiptBtn = document.getElementById('printReceiptBtn');

    let examSubmitted = false;
    let currentScore = 0;
    const totalQuestions = questions.length;

    function renderQuestions() {
      if (!container) return;
      let html = '';
      questions.forEach((q, index) => {
        const qNumber = index + 1;
        html += `<div class="question-card" data-qindex="${index}">`;
        html += `<div class="q-title"><span class="q-num">${qNumber}</span> ${q.q}</div>`;
        html += `<div class="options">`;
        q.options.forEach((opt, optIndex) => {
          html += `
            <label class="option-label">
              <input type="radio" name="q${index}" value="${optIndex}" data-qindex="${index}" data-optindex="${optIndex}">
              <span>${String.fromCharCode(65 + optIndex)}) ${opt}</span>
            </label>
          `;
        });
        html += `</div></div>`;
      });
      container.innerHTML = html;
      attachRadioListeners();
      updateAnsweredCount();
    }

    function attachRadioListeners() {
      document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.removeEventListener('change', radioChangeHandler);
        radio.addEventListener('change', radioChangeHandler);
      });
    }

    function radioChangeHandler() {
      updateAnsweredCount();
      if (examSubmitted) {
        receiptDiv.classList.remove('receipt-active');
        statusMessage.textContent = 'Answers changed. Press CHECK EXAM again.';
        examSubmitted = false;
        scoreDisplay.textContent = '- / 100';
      }
    }

    function updateAnsweredCount() {
      const checked = document.querySelectorAll('input[type="radio"]:checked');
      const unique = new Set();
      checked.forEach(r => {
        const idx = r.getAttribute('data-qindex');
        if (idx !== null) unique.add(idx);
      });
      const answered = unique.size;
      if (answeredCountSpan) answeredCountSpan.textContent = `${answered}/${totalQuestions} answered`;
      return answered;
    }

    function evaluateExam() {
      let correct = 0;
      for (let i = 0; i < totalQuestions; i++) {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && parseInt(selected.value, 10) === questions[i].correct) correct++;
      }
      return correct;
    }

    function showResult(score) {
      currentScore = score;
      scoreDisplay.textContent = `${score} / ${totalQuestions}`;
      const pct = (score / totalQuestions) * 100;
      if (pct >= 90) statusMessage.textContent = '🌟 Excellent!';
      else if (pct >= 70) statusMessage.textContent = '🌱 Good knowledge.';
      else if (pct >= 50) statusMessage.textContent = '📘 Fair, review principles.';
      else statusMessage.textContent = '🌍 Needs improvement.';
    }

    function getStudentDetails() {
      const name = studentNameInput?.value.trim() || '____________________';
      const number = studentNumberInput?.value.trim() || '____________________';
      return { name, number };
    }

    function generateReceipt(score, total) {
      const { name, number } = getStudentDetails();
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      const pct = ((score / total) * 100).toFixed(1);
      return `🧾 ECOTOURISM FINAL EXAM RECEIPT\n` +
        `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
        ` Student Name   : ${name}\n` +
        ` Student Number : ${number}\n` +
        ` Date           : ${dateStr}  ${timeStr}\n` +
        ` Exam           : Ecotourism 100-Item Multiple Choice\n` +
        `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
        ` 📊 SCORE       : ${score} out of ${total}  (${pct}%)\n` +
        ` Status         : ${pct >= 70 ? 'PASSED ✅' : 'NEEDS REVIEW ❌'}\n` +
        `━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n` +
        ` Verified automatically · Offline exam\n` +
        ` "Travel responsibly, leave only footprints."\n` +
        ` 🌿 Thank you for supporting ecotourism.`;
    }

    function updateReceipt(score, total) {
      receiptDiv.textContent = generateReceipt(score, total);
      receiptDiv.classList.add('receipt-active');
    }

    function handleCheck() {
      const answered = updateAnsweredCount();
      if (answered < totalQuestions) {
        alert(`⚠️ Only ${answered} of ${totalQuestions} answered. Proceeding with check.`);
      }
      const score = evaluateExam();
      showResult(score);
      updateReceipt(score, totalQuestions);
      examSubmitted = true;
    }

    function handleReset() {
      document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
      examSubmitted = false;
      currentScore = 0;
      scoreDisplay.textContent = '- / 100';
      statusMessage.textContent = '';
      receiptDiv.classList.remove('receipt-active');
      receiptDiv.textContent = '';
      updateAnsweredCount();
    }

    function handlePrintReceipt() {
      if (!receiptDiv.classList.contains('receipt-active')) {
        alert('🖨️ Please CHECK EXAM first to generate a receipt.');
        return;
      }
      const content = receiptDiv.textContent;
      const printWindow = window.open('', '_blank', 'width=520,height=580');
      if (!printWindow) {
        alert('Please allow pop-ups to print receipt.');
        return;
      }
      printWindow.document.write(`
        <html>
          <head><title>Ecotourism Receipt</title>
          <style>
            body { font-family: 'Courier New', monospace; background: #f9f9f2; display: flex; justify-content: center; padding: 2rem; }
            pre { background: white; border: 2px dashed #2f5a3b; padding: 2rem; border-radius: 2rem; font-size: 1rem; white-space: pre-wrap; max-width: 480px; }
          </style>
          </head>
          <body><pre>${content.replace(/\n/g, '<br>')}</pre></body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
      printWindow.close();
    }

    checkBtn.addEventListener('click', handleCheck);
    resetBtn.addEventListener('click', handleReset);
    printReceiptBtn.addEventListener('click', handlePrintReceipt);

    renderQuestions();
  })();
</script>
</body>
</html>
