<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENS 106 Midterm Examination - Interactive</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --error-color: #c0392b;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--primary-color);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
            text-transform: uppercase;
        }

        header h2 {
            margin: 5px 0;
            font-size: 18px;
            color: var(--secondary-color);
        }

        .user-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #eef2f3;
            border-radius: 8px;
        }

        .user-info div {
            display: flex;
            flex-direction: column;
        }

        .user-info label {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .user-info input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        #timer-container {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary-color);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exam-section {
            margin-bottom: 40px;
        }

        .week-header {
            background: var(--secondary-color);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            margin: 30px 0 20px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .question-block {
            margin-bottom: 25px;
            padding: 20px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }

        .question-block:hover {
            background: #fafafa;
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .option-item:hover {
            background-color: #e3f2fd;
            border-color: var(--accent-color);
        }

        .option-item input {
            margin-right: 15px;
            transform: scale(1.2);
        }

        #submit-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: var(--success-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 40px;
        }

        #submit-btn:hover {
            background: #219150;
        }

        #result-container {
            display: none;
            text-align: center;
            margin-top: 40px;
            padding: 30px;
            border: 4px solid var(--primary-color);
            border-radius: 12px;
            background: #fff;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }

        /* Receipt Styles */
        #receipt {
            display: none;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border: 2px dashed #333;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            background: #fff;
        }

        .receipt-header {
            font-weight: bold;
            border-bottom: 1px solid #333;
            margin-bottom: 10px;
            padding-bottom: 10px;
        }

        .receipt-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .print-btn {
            background: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #receipt, #receipt * {
                visibility: visible;
            }
            #receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none;
            }
        }

        .locked {
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>

        <form id="exam-form">
            <div id="questions-container"></div>

        <div id="result-container">
            <h2>Exam Results</h2>

            <p id="score-message"></p>

            <div id="receipt">

                </div>
                <div class="receipt-item"><span>Student:</span> <span id="r-name">-</span></div>

                <div class="receipt-item"><span>Course:</span> <span>ENS 106</span></div>

            <button class="print-btn" onclick="window.print()">Print Receipt</button>
        </div>
    </div>

        function renderExam() {
            const container = document.getElementById('questions-container');
            let html = '';

            questions.forEach(section => {
                html += `<div class="week-header">${section.week}</div>`;
                section.items.forEach(item => {
                    html += `
                        <div class="question-block" id="q-block-${item.id}">
                            <span class="question-text">${item.id}. ${item.q}</span>
                            <div class="options-grid">
                                ${item.options.map((opt, idx) => {
                                    const letter = String.fromCharCode(65 + idx);
                                    return `
                                        <label class="option-item">
                                            <input type="radio" name="q${item.id}" value="${letter}">
                                            ${letter}. ${opt}
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                });
            });

            container.innerHTML = html;
        }

        function startTimer() {
            let time = 60 * 60;
            const timerEl = document.getElementById('timer');

            const interval = setInterval(() => {
                const mins = Math.floor(time / 60);
                const secs = time % 60;
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (time <= 0) {
                    clearInterval(interval);
                    submitExam(true);
                }
                time--;
            }, 1000);
        }

        function submitExam(autoLock = false) {
            const name = document.getElementById('student-name').value || "Anonymous Student";
            const details = document.getElementById('student-details').value || "Not Provided";

            let score = 0;
            const total = 75;

            for (let i = 1; i <= total; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && selected.value === answerKey[i]) {
                    score++;
                }
            }

            // Lock Exam
            document.getElementById('exam-form').classList.add('locked');
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('timer-container').style.display = 'none';

            // Results
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('final-score').textContent = `${score} / ${total}`;

            const percentage = (score / total) * 100;
            let message = "";
            if (percentage >= 75) message = "Excellent work! You have a strong grasp of Environmental Management.";
            else if (percentage >= 50) message = "Good effort. You've passed the midterm.";
            else message = "You may need to review the course materials for these weeks.";

            document.getElementById('score-message').textContent = message;

            // Receipt
            document.getElementById('receipt').style.display = 'block';
            document.getElementById('r-name').textContent = name;
            document.getElementById('r-date').textContent = new Date().toLocaleDateString();
            document.getElementById('r-score').textContent = `${score} / ${total}`;

            window.scrollTo({ top: document.getElementById('result-container').offsetTop, behavior: 'smooth' });
        }

        window.onload = () => {
            renderExam();
            startTimer();
        };
    </script>
</body>
</html>
